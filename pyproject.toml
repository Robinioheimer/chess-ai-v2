[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-ai-v2"
version = "0.1.0"
description = "A native desktop chess analysis overlay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "python-chess>=1.999",
  "pynput>=1.7.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["nuitka>=2.6"]

[project.scripts]
chess-ai-v2 = "chess_ai_v2.app:main"

[tool.setuptools.packages.find]
include = ["chess_ai_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
